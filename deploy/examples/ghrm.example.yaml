# Example ghrm configuration. Copy to /etc/ghrm/ghrm.yaml and adjust.
proxmox:
  url: https://pve.example.test:8006
  node: pve
  token_id: ghrm@pve!ghrm
  token_secret_file: /etc/ghrm/proxmox-token   # or set GHRM_PROXMOX_TOKEN_SECRET
  # Pin the self-signed Proxmox certificate instead of disabling verification.
  # Proxmox UI: Datacenter > <node> > System > Certificates > pve-ssl.pem > View Certificate.
  # Or: openssl s_client -connect pve.example.test:8006 </dev/null | openssl x509 -noout -fingerprint -sha256
  tls_fingerprint: "00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF"
  insecure_skip_verify: false
  template_vmid: 9000                           # must be outside vmid_range
  pool: ghrm                                    # required; the API token is scoped to this pool
  vmid_range:
    start: 900
    end: 999
  thin_pool: data                               # LV name; read when the token has Sys.Audit on "/"
  storage: local-lvm                            # storage ID; used for disk usage otherwise
  firewall_settle: 12s

# --- ghrm serve ---
data_dir: /var/lib/ghrm
# REST API, SSE and the web UI. Bind to the LAN address only: 0.0.0.0 would also
# expose it on the job network, where jobs run.
listen: 192.0.2.10:8080
admin_token_file: /etc/ghrm/admin-token   # enables mutating API calls (Bearer token)

ingest:
  listen: 10.50.0.2:8443             # control-plane address on the job network
  advertise_url: https://10.50.0.2:8443

github:
  credentials:
    - name: personal
      token_file: /etc/ghrm/github-personal   # or GHRM_GITHUB_TOKEN_PERSONAL

capacity:
  max_environments: 4
  memory_budget_mb: 16384
  memory_margin_mb: 4096
  max_disk_percent: 85

scale_sets:
  - name: homelab                    # also the runs-on label
    url: https://github.com/octo/repo
    credential: personal
    max_concurrent: 2
    cores: 2
    memory_mb: 4096
    keep_on_failure_minutes: 0

# Template builds (spec §8). ghrm builds templates from GitHub's ubuntu-slim recipe plus the
# ghrm layer, verifies them and keeps the previous one for roll-back. Disabled until vmid_range is set;
# until the first build is active, environments clone proxmox.template_vmid.
templates:
  vmid_range: {start: 950, end: 958}   # inside the token's pool, outside proxmox.vmid_range
  storage: local                       # archives ("vztmpl" content)
  rootfs_gb: 16
  builder_disk_gb: 48
  builder_cores: 4
  builder_memory_mb: 8192
  keep: 2                              # the active version and one to roll back to
  check_interval: 24h                  # new ubuntu-slim / runner releases; 0 disables
  auto_activate: true                  # only when every check passes and the report has no unexpected differences
  nameserver: 1.1.1.1
  bridge: jobnet
  firewall_group: gh-runner
  # Addresses a job must not reach; the self-test fails if any answers.
  selftest_blocked: ["192.168.1.1:443", "192.168.1.10:8006"]
  # agent_path: /usr/local/bin/ghrm-agent   # served to builders; default: next to the ghrm binary
