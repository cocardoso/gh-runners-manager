name: release

# A tag vX.Y.Z publishes the binaries the installer downloads, the installer itself,
# and the container image.
on:
  push:
    tags: ["v*"]

# Actions are pinned by commit; the release artifacts carry signed build provenance
# (verify with: gh attestation verify <file> --repo cocardoso/gh-runners-manager).
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          ldflags="-s -w -X github.com/cocardoso/gh-runners-manager/internal/version.Version=${GITHUB_REF_NAME} -X github.com/cocardoso/gh-runners-manager/internal/version.Commit=${GITHUB_SHA::7}"
          mkdir -p out
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o out/ghrm-linux-amd64 ./cmd/ghrm
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o out/ghrm-agent-linux-amd64 ./cmd/ghrm-agent
          cp deploy/proxmox/install.sh out/
          (cd out && sha256sum ghrm-linux-amd64 ghrm-agent-linux-amd64 install.sh > SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "out/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --build-arg VERSION="$GITHUB_REF_NAME" --build-arg COMMIT="${GITHUB_SHA::7}" -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
